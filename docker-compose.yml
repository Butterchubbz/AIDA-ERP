# ==============================================================================
# AIDA-ERP — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
services:
  # --- POCKETBASE DATABASE ENGINE ---
  pocketbase:
    container_name: aida-database
    build:
      context: .
      dockerfile: Dockerfile.pb
    volumes:
      - pb_data:/pb_data
    # PB_ADMIN_EMAIL/PB_ADMIN_PASSWORD are OPTIONAL. If set (e.g. via a .env file),
    # the container upserts that superuser on first boot. If left unset, the
    # container starts without a superuser and the AIDA setup wizard (opened in
    # your browser on first run) lets you create the first superuser instead.
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
    # Expose port 8090 so administrators can access the PocketBase backend admin UI.
    # For a purely secure deployment, you can bind this locally (127.0.0.1:8090:8090)
    # or remove the ports section entirely so only the Express container has access.
    ports:
      - "8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- AIDA MONOREPO APPLICATION SERVER ---
  aida-app:
    container_name: aida-application
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      # Durable home for the backend's local .env file (encryption key and,
      # when provisioned via the setup wizard instead of PB_ADMIN_* env vars,
      # the PocketBase superuser credentials). Without this, those wizard
      # writes would live only in the container's ephemeral filesystem and be
      # lost on the next `docker compose up`/restart.
      - aida_backend_env:/usr/src/app/packages/backend/.env-data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - PB_URL=http://pocketbase:8090
      - AIDA_LOCAL_ENV_PATH=/usr/src/app/packages/backend/.env-data/.env
      # The browser reaches the Express-served UI at localhost:3001.
      - ALLOWED_ORIGIN=http://localhost:3001
      
      # ------------------------------------------------------------------------
      # SECURITY CREDENTIALS
      # ------------------------------------------------------------------------
      # Tip: Instead of hardcoding these in the docker-compose.yml file,
      # place them inside a ".env" file in the same directory as this file.
      # Docker Compose will automatically read and inject them here!
      #
      # - JWT_SECRET=your_32_character_base64_secret_key_here
      # - AIDA_ENCRYPTION_KEY=your_64_character_hex_encryption_key_here
      #
      # PB_ADMIN_EMAIL/PB_ADMIN_PASSWORD are OPTIONAL — leave them unset for a
      # first run and use the in-browser setup wizard to create the PocketBase
      # superuser instead:
      # - PB_ADMIN_EMAIL=admin@your-company.com
      # - PB_ADMIN_PASSWORD=your_strong_admin_password_here
    env_file:
      - .env
    restart: unless-stopped

# --- PERSISTENT DATA VOLUMES ---
# Ensures your database files survive container updates, builds, and system reboots.
volumes:
  pb_data:
    driver: local
  aida_backend_env:
    driver: local
